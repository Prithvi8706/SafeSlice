# DESIGN INTENT VALIDATED AGAINST THE SIMULATOR. Still unvalidated against real hardware.
#
# Originally marked PROVISIONAL (docs/PLAN.md deviation D1) because it was a guess, written
# before any measurement existed, about what would trip the guardrail. It was to be retuned in
# Week 1b against real OVS behaviour. That never happened - the testbed was not built - so the
# retuning is not pending, it is abandoned, and the honest thing is to say what the scenario has
# and has not been checked against.
#
# WHAT WAS CHECKED. Across all 80 adversarial runs (8 policies x 10 seeds, post warm-up):
#
#     calm phases (0, 2, 4):        0 violations / 17,440 steps  =  0.00 %
#     strike phases (1, 3, 5):    562 violations /  4,160 steps  = 13.51 %
#
# EVERY violation this scenario produces happens inside a strike. Not most - all of them. The
# lure-then-strike structure below is therefore doing exactly what it was written to do, and the
# scenario is not merely "hard", it is hard in the specific way it claims to be.
#
# The per-policy ordering inside the strikes is the second confirmation, and it is the one worth
# putting in the report:
#
#     epsilon_greedy (context-free)   30.4 %   lured highest, caught worst
#     linucb online                   19.2 %
#     threshold                       15.6 %
#     linucb pre-trained              12.5 %   caught least of any adaptive policy
#     static_equal                     0.2 %   never climbs far enough to be caught
#     static_safe / oracle             0.0 %   cannot be lured / knows the phase boundaries
#
# A context-free bandit is caught more than twice as often as a converged contextual one on the
# same traffic. That is direct evidence that the context vector carries information about an
# impending strike, which is the hypothesis the whole project rests on.
#
# WHAT WAS NOT CHECKED. Whether real OVS produces the same lure-and-strike dynamics at all. The
# phase durations below are tuned against this simulator's EWMA time constant, and on hardware
# with different jitter the 6 s strike may be too short or too long to have the same effect. Do
# not present this scenario as a validated adversarial workload for real networks.
#
# ONE HONEST QUALIFICATION. This scenario was built to exploit the lag of a smoothed latency
# signal, and it does produce violations exactly where intended. But it is NOT the scenario where
# the guardrail's fast instantaneous path matters most: measured by the share of escalations
# tripped by the instantaneous p95 alone, ramp is highest at 78.7 % and adversarial is 61.9 %.
# The lure-then-strike structure concentrates DAMAGE in the strikes; it is not the workload that
# most exercises the fast path. Both statements are true and the report should not conflate them.
#
# Attack idea: exploit the EWMA lag. Hold URLLC low long enough that the latency EWMA settles and
# any latency-reactive policy has raised eMBB to an aggressive level, then step URLLC up sharply
# for a burst that is shorter than the EWMA time constant. A purely reactive policy pays a full
# violation before it can respond. A guardrail that only watches the EWMA is late for the same
# reason; a guardrail that also watches instantaneous p95 is not. That difference is the point.

scenario:
  name: adversarial
  description: "Long calm periods that lure eMBB high, punctuated by short sharp URLLC steps."
  repeat: cyclic
  jitter_cv:
    urllc: 0.05
    embb: 0.15
    be: 0.25
  phases:
    # Lure: URLLC below its guarantee, eMBB demand high. Safe, so policies drift to a high level.
    - {duration_s: 30, urllc_mbps: 1.2, embb_mbps: 9.0, be_mbps: 3.5}
    # Strike: URLLC steps well above its guarantee for less than the EWMA settling time.
    - {duration_s: 6,  urllc_mbps: 4.0, embb_mbps: 9.0, be_mbps: 3.5}
    # Relax, just long enough to re-lure but not long enough to fully forget.
    - {duration_s: 20, urllc_mbps: 1.2, embb_mbps: 9.0, be_mbps: 3.5}
    - {duration_s: 6,  urllc_mbps: 4.0, embb_mbps: 9.0, be_mbps: 3.5}
    - {duration_s: 35, urllc_mbps: 1.2, embb_mbps: 9.0, be_mbps: 3.5}
    - {duration_s: 8,  urllc_mbps: 4.0, embb_mbps: 9.0, be_mbps: 3.5}
